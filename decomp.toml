# Project settings read by tools/psp (see tools/psp/project.py)

title = "Monster Hunter Freedom Unite"

# First one is the default version
versions = [
    "ULES01213",  # Europe, Monster Hunter Freedom Unite
    "ULUS10391",  # USA, Monster Hunter Freedom Unite
    "ULJM05500",  # Japan, Monster Hunter Portable 2nd G
]

binutils_prefix = "mips-ps2-decompals-"

# Main executable: PSP_GAME/SYSDIR/BOOT.BIN, a plain static ELF (ET_EXEC). The
# encrypted EBOOT.BIN holds the same image (notes/PROVENANCE.md).
[modules.boot]
file = "BOOT.BIN"
splat = "splat.boot.yaml"
relocatable = false

# Compiler of the C/C++ units (tools/configure.py, tools/psp/batch_units.py):
# mwccpsp 3.0.1, builds 147-219 give the same code on the probes, -O3 and above
# match them (notes/COMPILER.md). Downloaded to tools/compilers/<name>/.
[compiler]
name = "mwccpsp_3.0.1_219"
exe = "mwccpsp.exe"
flags = "-O4 -sdatathreshold 0"

# tools/psp/batch_units.py: the Metrowerks regions of .text (notes/SPLITS.md):
# game and engine, then the C++ runtime at the end of .text
[batch]
splits = "notes/SPLITS.md"
jobs = 8  # parallel workers; also run ninja -j 8

[batch.ranges]
ULES01213 = [[0x08811C84, 0x08903A94], [0x0890BE00, 0x0890DE38]]

[traces]
allow = ["decompile this for me"]
