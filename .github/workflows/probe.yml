name: Compiler probe

# Manual run: compile a probe file with a decomp.me compiler that only exists for
# Linux and compare each func_XXXXXXXX with BOOT.BIN (tools/psp/compiler_probe.py).
# The log shows OK/DIFF per function and the probe's own disassembly, no game bytes.

on:
  workflow_dispatch:
    inputs:
      compiler:
        description: decomp.me compiler id, or pspdev-<release tag> (pspdev-latest) for the pspdev toolchain
        default: psp-gcc-1.3.1
      probe:
        description: probe source
        default: tools/probes/lib_leaf.c
      as_from:
        description: take the assembler from this other compiler id (optional)
        default: ""
      flags:
        description: flag sets, separated by ';'
        default: -O1 -G0;-O2 -G0;-O3 -G0;-Os -G0;-O2 -G0 -fno-optimize-sibling-calls

jobs:
  probe:
    # private build container (YggdrasziI/mhfu-decomp-build): game files in /orig
    container:
      image: ghcr.io/yggdraszii/mhfu-decomp-build:main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Prepare
        run: |
          cp -a /orig/. ./orig/
          pip install -r tools/requirements.txt
          python tools/configure.py
          ninja

      - name: Compiler
        run: |
          # the psp-gcc archives hold 32-bit x86 binaries
          dpkg --add-architecture i386
          apt-get update -qq && apt-get install -y -qq --no-install-recommends libc6:i386 file >/dev/null
          case "${{ inputs.compiler }}" in
            pspdev-*)
              # prebuilt pspdev toolchain (homebrew GCC, github.com/pspdev/pspdev releases)
              apt-get install -y -qq --no-install-recommends libmpc3 libmpfr6 libgmp10 libisl23 libzstd1 zlib1g >/dev/null
              tag="${{ inputs.compiler }}"; tag="${tag#pspdev-}"
              if [ "$tag" = latest ]; then base=latest/download; else base="download/$tag"; fi
              mkdir -p "tools/compilers/${{ inputs.compiler }}"
              python -c "import sys, urllib.request; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" \
                "https://github.com/pspdev/pspdev/releases/$base/pspdev-ubuntu-latest-x86_64.tar.gz" /tmp/pspdev.tar.gz
              tar -xzf /tmp/pspdev.tar.gz -C "tools/compilers/${{ inputs.compiler }}" --strip-components=1
              ;;
            *)
              python tools/psp/download_tool.py compiler "${{ inputs.compiler }}" --path "tools/compilers/${{ inputs.compiler }}"
              ;;
          esac
          chmod -R u+x "tools/compilers/${{ inputs.compiler }}"
          if [ -n "${{ inputs.as_from }}" ]; then
            python tools/psp/download_tool.py compiler "${{ inputs.as_from }}" --path "tools/compilers/${{ inputs.as_from }}"
            chmod -R u+x "tools/compilers/${{ inputs.as_from }}"
          fi
          find "tools/compilers/${{ inputs.compiler }}" -type f \( -name as -o -name cc1 -o -name gcc -o -name 'psp-*' \) -exec file {} \;

      - name: Probe
        env:
          COMPILER: ${{ inputs.compiler }}
          AS_FROM: ${{ inputs.as_from }}
          PROBE: ${{ inputs.probe }}
          FLAGS: ${{ inputs.flags }}
        run: |
          # archive layouts differ: bin/psp-gcc (1.3.1) or a gcc driver elsewhere
          cc="tools/compilers/$COMPILER/bin/psp-gcc"
          [ -f "$cc" ] || cc=$(find "tools/compilers/$COMPILER" -type f \( -name 'psp-gcc' -o -name 'gcc' \) | head -n 1)
          echo "compiler: $cc"; file "$cc"; "$cc" --version | head -n 1
          # drivers that do not find their passes: point -B at cc1 and as
          extra=""
          asdir="tools/compilers/${AS_FROM:-$COMPILER}"
          dirs="$(find "tools/compilers/$COMPILER" -type f -name cc1 -exec dirname {} \;)"
          dirs="$dirs $(find "$asdir" -type f -name as -exec dirname {} \;)"
          for p in $dirs; do
            extra="$extra -B$(pwd)/$p/"
          done
          echo "extra:$extra"
          IFS=';'
          for f in $FLAGS; do
            echo "=== $f"
            IFS=' '
            python tools/psp/compiler_probe.py "$PROBE" --cc "$cc" -- $extra $f || true
            echo "::group::disassembly ($f)"
            tools/binutils/mips-ps2-decompals-objdump -d --no-show-raw-insn "${PROBE%.*}.o" || true
            IFS=';'
            echo "::endgroup::"
          done
